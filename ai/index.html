<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="aa6aa18f-f2d9-4b7f-be91-9fffdc04d89f"></script>

    <!-- Vercel Web Analytics -->
    <script type="module">
      try {
        import('https://cdn.jsdelivr.net/npm/@vercel/analytics@2/dist/index.mjs')
          .then(m => m.inject())
          .catch(() => {});
      } catch (e) {}
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked AIs — "Education" Games</title>
    <meta name="description" content="Unblocked AI tools and resources for education.">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" href="https://www.google.com/favicon.ico" sizes="any">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #09090b;
            color: #fafafa;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            min-height: 100%;
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 6px max(14px, env(safe-area-inset-right)) 6px max(14px, env(safe-area-inset-left));
            border-bottom: 1px solid #27272a;
            background: rgba(9, 9, 11, 0.92);
            flex-shrink: 0;
        }

        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            border: 1px solid #27272a;
            border-radius: 8px;
            color: #a1a1aa;
            font-size: 16px;
            line-height: 1;
            text-decoration: none;
        }

        .back:hover { color: #fafafa; border-color: #3f3f46; }

        h1 {
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .open {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-height: 32px;
            padding: 0 10px;
            flex-shrink: 0;
            border: 1px solid #27272a;
            border-radius: 8px;
            background: #18181b;
            color: #d4d4d8;
            font-size: 11.5px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
        }

        .open:hover { color: #fafafa; border-color: #3f3f46; background: #27272a; }
        .open .short { display: none; }

        .mobile-tip {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid #27272a;
            background: #18181b;
            color: #a1a1aa;
            font-size: 11.5px;
            line-height: 1.3;
            text-align: center;
        }

        .mobile-tip a {
            color: #fbbf24;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .doc {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #ffffff;
        }

        .doc iframe {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }

        .doc-loading {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #09090b;
            color: #71717a;
            font-size: 12px;
        }

        .doc-loading[hidden] { display: none; }

        .doc-loading::before {
            content: "";
            width: 14px;
            height: 14px;
            border: 2px solid #3f3f46;
            border-top-color: #fafafa;
            border-radius: 50%;
            animation: doc-spin 0.8s linear infinite;
        }

        @keyframes doc-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .doc-loading::before { animation: none; }
        }

        @media (max-width: 640px) {
            header {
                gap: 8px;
                min-height: 44px;
                padding: 6px max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
            }

            h1 { font-size: 13px; }

            .open {
                min-height: 30px;
                padding: 0 8px;
                gap: 3px;
                font-size: 11px;
            }

            .open .full { display: none; }
            .open .short { display: inline; }
            .mobile-tip { display: flex; }
        }
    </style>
</head>
<body>
    <header>
        <a class="back" href="/" aria-label="Back to games">←</a>
        <h1>Unblocked AIs</h1>
        <a class="open" href="https://docs.google.com/document/d/1GweIms0mEh7_xFqV_thEG4OWF_KN3wm-U1Ikopht7Qg/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
            <span class="full">Open in Google Docs</span>
            <span class="short">Google Docs</span>
            <span aria-hidden="true">↗</span>
        </a>
    </header>
    <div class="mobile-tip">
        <span>Tiny text?</span>
        <a href="https://docs.google.com/document/d/1GweIms0mEh7_xFqV_thEG4OWF_KN3wm-U1Ikopht7Qg/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Open the full document ↗</a>
    </div>
    <main class="doc">
        <div class="doc-loading" id="doc-loading" role="status">Loading document…</div>
        <iframe
            src="https://docs.google.com/document/d/1GweIms0mEh7_xFqV_thEG4OWF_KN3wm-U1Ikopht7Qg/preview"
            title="Unblocked AIs"
            allowfullscreen
            onload="document.getElementById('doc-loading').hidden = true"
        ></iframe>
    </main>
    <noscript><style>.doc-loading { display: none; }</style></noscript>
</body>
</html>
