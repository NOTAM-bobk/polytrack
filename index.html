<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Games</title>

    <!-- Vercel Web Analytics -->
    <script type="module">
      import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@2/dist/index.mjs';
      inject();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* aahhh: css inside of html */
        :root {
            --tarmac: #141628;
            --panel: #1f2340;
            --panel-top: #22274a;
            --chalk: #eef0f8;
            --slate: #9aa0bd;
            --hairline: #333a5f;
            --signal: #f7c24b;
            --dock-surface: rgba(24, 27, 45, 0.94);
            --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
            --font-ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            color: var(--chalk);
            background:
                radial-gradient(900px 520px at 20% -10%, #27315d 0%, rgba(39, 49, 93, 0) 62%),
                radial-gradient(720px 440px at 98% 4%, #1b2a4e 0%, rgba(27, 42, 78, 0) 60%),
                linear-gradient(180deg, #141628 0%, #101226 72%, #0d0f1e 100%);
            font-family: var(--font-ui);
            font-size: 16px;
            line-height: 1.5;
            color-scheme: dark;
            -webkit-font-smoothing: antialiased;
        }

        /* start/finish line across the top of the screen */
        .start-line {
            position: absolute;
            inset: 0 0 auto 0;
            height: 10px;
            background-image: repeating-conic-gradient(
                from 0deg,
                rgba(238, 240, 248, 0.3) 0deg 90deg,
                rgba(238, 240, 248, 0) 90deg 180deg
            );
            background-size: 20px 20px;
        }

        /* faceted low-poly horizon */
        .terrain {
            position: absolute;
            inset: auto 0 0 0;
            width: 100%;
            height: clamp(150px, 30vh, 300px);
            opacity: 0.85;
            pointer-events: none;
        }

        .screen {
            position: relative;
            z-index: 1;
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            justify-content: flex-start;
            justify-content: safe center;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            width: min(680px, 100% - 40px);
            margin-inline: auto;
            padding-block: clamp(28px, 5vh, 56px) 24px;
            scrollbar-width: thin;
            scrollbar-color: #39406a transparent;
        }

        h1 {
            margin: 0 0 clamp(20px, 3.5vh, 32px);
            font-family: var(--font-display);
            font-size: clamp(2.6rem, 8.5vw, 4.25rem);
            font-weight: 700;
            line-height: 0.92;
            letter-spacing: -0.005em;
            text-wrap: balance;
        }

        .group + .group {
            margin-top: clamp(20px, 3vh, 32px);
        }

        .group h2 {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin: 0 0 12px;
            font-family: var(--font-display);
            font-size: 1.55rem;
            font-weight: 600;
            letter-spacing: 0.005em;
            white-space: nowrap;
        }

        .group h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--hairline);
        }

        .lanes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .lane {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 56px;
            padding: 14px 20px;
            border: 1px solid var(--hairline);
            border-left-width: 3px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--panel-top), var(--panel));
            color: inherit;
            text-decoration: none;
            transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
        }

        .lane__name {
            font-family: var(--font-display);
            font-size: 1.45rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            line-height: 1.15;
        }

        .lane__play {
            width: 0;
            height: 0;
            border-left: 9px solid var(--slate);
            border-top: 5.5px solid transparent;
            border-bottom: 5.5px solid transparent;
            transition: border-left-color 0.18s ease;
        }

        a.lane:hover {
            border-color: #545e93;
            border-left-color: var(--signal);
            background: linear-gradient(180deg, #28305a, #212748);
        }

        a.lane:hover .lane__play {
            border-left-color: var(--signal);
        }

        a.lane:active {
            transform: translateY(1px);
        }

        a.lane:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 3px;
        }

        /* archived build: kept on the list, not offered */
        .lane--archived {
            border-color: #262b48;
            border-left-color: #2e3455;
            background: linear-gradient(180deg, #1b1e33, #181b2d);
            color: #7b82a1;
            cursor: not-allowed;
        }

        /* reserved ad space */
        .ad-slot {
            display: grid;
            place-items: center;
            min-height: 84px;
            margin-top: clamp(20px, 3vh, 32px);
            padding: 16px;
            border: 1px dashed #3b4269;
            border-radius: 3px;
            background: rgba(31, 35, 64, 0.35);
        }

        .ad-slot p {
            margin: 0;
            color: #828aa9;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
        }

        /* bottom menu bar */
        .screen::-webkit-scrollbar {
            width: 8px;
        }

        .screen::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: #39406a;
        }

        .screen::-webkit-scrollbar-track {
            background: transparent;
        }

        .dock {
            position: relative;
            z-index: 20;
            flex: 0 0 auto;
            align-self: center;
            margin: 12px 0 20px;
        }

        .dock__tip {
            position: absolute;
            left: 0;
            bottom: calc(100% + 3px);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            padding: 0 12px;
            border: 1px solid rgba(51, 58, 95, 0.9);
            border-radius: 8px;
            background: var(--dock-surface);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
            color: var(--chalk);
            font-size: 13px;
            font-weight: 500;
            line-height: 1.15;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out, left 0.3s ease-in-out;
        }

        .dock__tip.is-visible {
            opacity: 1;
            transform: none;
        }

        .dock__bar {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 40px;
            padding: 0 6px;
            border: 1px solid rgba(51, 58, 95, 0.9);
            border-radius: 999px;
            background: var(--dock-surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 8px 16px -4px rgba(0, 0, 0, 0.35);
        }

        .dock__bar a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 999px;
            color: var(--slate);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.18s ease, color 0.18s ease;
        }

        .dock__bar a:hover,
        .dock__bar a:focus-visible {
            background: rgba(44, 51, 84, 0.9);
            color: var(--chalk);
        }

        .dock__bar a:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 1px;
        }

        .dock__bar svg {
            display: block;
            width: 18px;
            height: 18px;
        }

        @media (max-width: 540px) {
            .lane {
                min-height: 52px;
                padding: 12px 16px;
            }

            .lane__name {
                font-size: 1.3rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="start-line" aria-hidden="true"></div>

    <svg class="terrain" aria-hidden="true" focusable="false" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
        <polygon points="0,300 0,148 152,88 300,166 468,108 642,190 820,116 1000,184 1200,126 1200,300" fill="#1b2040" />
        <polygon points="0,300 0,214 190,166 362,232 540,178 730,246 900,194 1080,242 1200,204 1200,300" fill="#181d38" />
        <polyline points="0,214 190,166 362,232 540,178 730,246 900,194 1080,242 1200,204" fill="none" stroke="#2c3463" stroke-width="1" />
        <polyline points="152,88 300,166 468,108" fill="none" stroke="#2c3463" stroke-width="1" opacity="0.6" />
    </svg>

    <main class="screen">
        <h1>Education Games</h1>

        <section class="group" aria-labelledby="polytrack">
            <h2 id="polytrack">PolyTrack</h2>
            <ul class="lanes">
                <li>
                    <div class="lane lane--archived" aria-disabled="true">
                        <span class="lane__name">v0.3.1</span>
                    </div>
                </li>
                <li>
                    <a class="lane" href="https://poly2.benlaunches.icu/0.5.0/index.html">
                        <span class="lane__name">v0.5.0</span>
                        <span class="lane__play" aria-hidden="true"></span>
                    </a>
                </li>
            </ul>
        </section>

        <section class="group" aria-labelledby="cookie-clicker">
            <h2 id="cookie-clicker">Cookie Clicker</h2>
            <ul class="lanes">
                <li>
                    <a class="lane" href="https://cookie.benlaunches.icu/">
                        <span class="lane__name">Cookie Clicker</span>
                        <span class="lane__play" aria-hidden="true"></span>
                    </a>
                </li>
            </ul>
        </section>

        <section class="group" aria-labelledby="eaglercraft">
            <h2 id="eaglercraft">Eaglercraft</h2>
            <ul class="lanes">
                <li>
                    <a class="lane" href="https://eaglercraft.com/play">
                        <span class="lane__name">Eaglercraft</span>
                        <span class="lane__play" aria-hidden="true"></span>
                    </a>
                </li>
            </ul>
        </section>

        <aside class="ad-slot" aria-label="Advertisement">
            <p>Ad will be here</p>
        </aside>
    </main>

    <nav class="dock" aria-label="Main">
        <div class="dock__tip" id="dock-tip" aria-hidden="true"></div>
        <div class="dock__bar">
            <a href="https://chat.benlaunches.icu" aria-label="Chat">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" stroke="currentColor">
                        <path d="M9,1.75C4.996,1.75,1.75,4.996,1.75,9c0,1.319,.358,2.552,.973,3.617,.43,.806-.053,2.712-.973,3.633,1.25,.068,2.897-.497,3.633-.973,.489,.282,1.264,.656,2.279,.848,.433,.082,.881,.125,1.338,.125,4.004,0,7.25-3.246,7.25-7.25S13.004,1.75,9,1.75Z" />
                    </g>
                </svg>
            </a>
            <a href="https://proxy.benlaunches.icu" aria-label="Proxy">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" stroke="currentColor">
                        <circle cx="9" cy="9" r="7.25" />
                        <ellipse cx="9" cy="9" rx="3.25" ry="7.25" />
                        <line x1="1.75" y1="9" x2="16.25" y2="9" />
                    </g>
                </svg>
            </a>
            <a href="https://edugame.benlaunches.icu" aria-label="Unblocked games">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" stroke="currentColor">
                        <rect x="2.25" y="2.25" width="5.5" height="5.5" rx="1.4" />
                        <rect x="10.25" y="2.25" width="5.5" height="5.5" rx="1.4" />
                        <rect x="2.25" y="10.25" width="5.5" height="5.5" rx="1.4" />
                        <rect x="10.25" y="10.25" width="5.5" height="5.5" rx="1.4" />
                    </g>
                </svg>
            </a>
            <a href="https://submitu.benlaunches.icu" aria-label="Submit a URL">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" stroke="currentColor">
                        <path d="M15.25,11.75v1.5c0,1.105-.895,2-2,2H4.75c-1.105,0-2-.895-2-2v-1.5" />
                        <polyline points="12.5 6.25 9 2.75 5.5 6.25" />
                        <line x1="9" y1="2.75" x2="9" y2="10.25" />
                    </g>
                </svg>
            </a>
        </div>
    </nav>

    <script>
        (function () {
            var bar = document.querySelector(".dock__bar");
            var tip = document.getElementById("dock-tip");
            if (!bar || !tip) return;

            var links = Array.prototype.slice.call(bar.querySelectorAll("a"));

            function showTip(link) {
                tip.textContent = link.getAttribute("aria-label");

                var barRect = bar.getBoundingClientRect();
                var linkRect = link.getBoundingClientRect();
                var tipWidth = tip.getBoundingClientRect().width;
                var left = linkRect.left - barRect.left + (linkRect.width - tipWidth) / 2;

                tip.style.left = Math.max(0, Math.min(left, barRect.width - tipWidth)) + "px";
                tip.classList.add("is-visible");
            }

            function hideTip() {
                tip.classList.remove("is-visible");
            }

            links.forEach(function (link) {
                link.addEventListener("mouseenter", function () {
                    showTip(link);
                });
                link.addEventListener("focus", function () {
                    showTip(link);
                });
                link.addEventListener("blur", hideTip);
            });

            bar.addEventListener("mouseleave", hideTip);
        })();
    </script>
</body>
</html>
