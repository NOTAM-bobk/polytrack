    <!-- Geist & Inter Fonts -->

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
              mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              background: '#09090b',
              foreground: '#fafafa',
            }
          }
        }
      }
    </script>

    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: #09090b;
        color-scheme: dark;
        color: #fafafa;
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Solid 3D card styling matching the attached element code style */
      .game-card {
        background: #1d1d1d !important;
        border-radius: 20px !important;
        border: none !important;
        position: relative;
        isolation: isolate;
        transform: perspective(1000px) translateZ(0);
        box-shadow:
          inset 0 0 0 1px rgba(44, 47, 54, 0.65),
          inset 0 0 50px 0 rgba(255, 255, 255, 0.02),
          0 10px 24px -6px rgba(0, 0, 0, 0.5),
          0 2px 6px rgba(0, 0, 0, 0.3) !important;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 220ms ease;
      }

      .game-card:hover {
        transform: perspective(1000px) translateY(-3px) translateZ(6px);
        box-shadow:
          inset 0 0 0 1px rgba(70, 75, 88, 0.8),
          inset 0 0 50px 0 rgba(255, 255, 255, 0.035),
          0 20px 36px -10px rgba(0, 0, 0, 0.7),
          0 6px 14px rgba(0, 0, 0, 0.4) !important;
      }

      .game-card:focus-within {
        outline: 1px solid rgba(228, 228, 231, 0.5);
        outline-offset: 2px;
      }

      /* Solid 3D container panels (catalog area, chat board, view counter) */
      .solid-3d-panel {
        background: #1d1d1d !important;
        border-radius: 20px !important;
        border: none !important;
        box-shadow:
          inset 0 0 0 1px rgba(44, 47, 54, 0.52),
          inset 0 0 50px 0 rgba(255, 255, 255, 0.02),
          0 14px 30px -8px rgba(0, 0, 0, 0.55),
          0 2px 8px rgba(0, 0, 0, 0.3) !important;
        position: relative;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .solid-3d-chip {
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      }

      @media (prefers-reduced-motion: reduce) {
        .game-card { transition: none; }
        .game-card:hover { transform: none; }
      }

      /* Clean subtle scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }

      /* Message Scroller primitive styles */
      .cn-message-scroller {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
      }

      .cn-message-scroller-viewport {
        width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .cn-message-scroller-content {
        display: flex;
        height: max-content;
        min-height: 100%;
        flex-direction: column;
      }

      .cn-message-scroller-item {
        min-width: 0;
        flex-shrink: 0;
      }

      .cn-message-scroller-button {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 10;
      }

      .cn-message-scroller-button[data-active="false"] {
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 8px) scale(0.95);
      }

      .cn-message-scroller-button[data-active="true"] {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .cn-message-scroller-button[data-direction="end"] {
        bottom: 0.75rem;
      }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-zinc-700 selection:text-white">

                <div style="font-size:1.125rem;font-weight:600;color:#fafafa;margin-bottom:0.25rem;">
                    "Education" Games
                </div>
                <div style="font-size:0.8125rem;color:#71717a;">Loading games...</div>
            </div>
        </div>
    </div>

    <!-- Pre-compiled application bundle -->
    <script src="./dist/home.bundle.js" onerror="this.onerror=null;this.src='./home.bundle.js';"></script>
</body>
</html>
