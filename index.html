<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyTrack // Hub - Speedrun Simulator & Game Portal</title>
    <meta name="description" content="Official PolyTrack speedrunning archive, custom track submissions, multiplayer servers, and retro arcade catalog with React live message scroller.">

    <!-- Bidvertiser2108105 -->

    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="aa6aa18f-f2d9-4b7f-be91-9fffdc04d89f"></script>

    <!-- Vercel Web Analytics -->
    <script type="module">
      try {
        import('https://cdn.jsdelivr.net/npm/@vercel/analytics@2/dist/index.mjs')
          .then(m => m.inject())
          .catch(() => {});
      } catch (e) {}
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Barlow"', 'system-ui', 'sans-serif'],
              display: ['"Barlow Condensed"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
              popover: {
                DEFAULT: 'hsl(var(--popover))',
                foreground: 'hsl(var(--popover-foreground))',
              },
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
            }
          }
        }
      }
    </script>

    <style>
      :root {
        --background: 224 71% 4%;
        --foreground: 213 31% 91%;
        --card: 224 71% 4%;
        --card-foreground: 213 31% 91%;
        --popover: 224 71% 4%;
        --popover-foreground: 215 20.2% 65.1%;
        --primary: 210 40% 98%;
        --primary-foreground: 222.2 47.4% 1.2%;
        --secondary: 222.2 47.4% 11.2%;
        --secondary-foreground: 210 40% 98%;
        --muted: 223 47% 11%;
        --muted-foreground: 215.4 16.3% 56.9%;
        --accent: 216 34% 17%;
        --accent-foreground: 210 40% 98%;
        --destructive: 0 63% 31%;
        --destructive-foreground: 210 40% 98%;
        --border: 216 34% 17%;
        --input: 216 34% 17%;
        --ring: 216 34% 17%;
        --radius: 0.5rem;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: #020617;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(51, 65, 85, 0.8);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 1);
      }

      /* Message Scroller primitive styles from attachment */
      .cn-message-scroller {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
      }

      .cn-message-scroller-viewport {
        width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .cn-message-scroller-content {
        display: flex;
        height: max-content;
        min-height: 100%;
        flex-direction: column;
      }

      .cn-message-scroller-item {
        min-width: 0;
        flex-shrink: 0;
      }

      .cn-message-scroller-button {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 10;
      }

      .cn-message-scroller-button[data-active="false"] {
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 12px) scale(0.95);
      }

      .cn-message-scroller-button[data-active="true"] {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .cn-message-scroller-button[data-direction="end"] {
        bottom: 1rem;
      }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root">
        <!-- Static loading placeholder while React hydrates -->
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#020617;color:#94a3b8;font-family:sans-serif;">
            <div style="text-align:center;">
                <div style="font-size:1.5rem;font-weight:bold;color:#f8fafc;margin-bottom:0.5rem;letter-spacing:0.1em;">
                    POLYTRACK <span style="color:#f59e0b;">//</span> HUB
                </div>
                <div style="font-size:0.875rem;color:#64748b;">Initializing React UI & telemetry...</div>
            </div>
        </div>
    </div>

    <!-- Pre-compiled zero-dependency React 18 application bundle -->
    <script src="./dist/home.bundle.js" onerror="this.onerror=null;this.src='./home.bundle.js';"></script>
</body>
</html>
