<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“Educational” games // Hub</title>
    <meta name="description" content="PolyTrack speedrunning archive, custom tracks, multiplayer servers, and arcade catalog.">

    <!-- Bidvertiser2108105 -->

    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="aa6aa18f-f2d9-4b7f-be91-9fffdc04d89f"></script>

    <!-- Vercel Web Analytics -->
    <script type="module">
      try {
        import('https://cdn.jsdelivr.net/npm/@vercel/analytics@2/dist/index.mjs')
          .then(m => m.inject())
          .catch(() => {});
      } catch (e) {}
    </script>

    <!-- Geist & Inter Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
              mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              background: '#09090b',
              foreground: '#fafafa',
            }
          }
        }
      }
    </script>

    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: #09090b;
        color: #fafafa;
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Clean subtle scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }

      /* Message Scroller primitive styles */
      .cn-message-scroller {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
      }

      .cn-message-scroller-viewport {
        width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .cn-message-scroller-content {
        display: flex;
        height: max-content;
        min-height: 100%;
        flex-direction: column;
      }

      .cn-message-scroller-item {
        min-width: 0;
        flex-shrink: 0;
      }

      .cn-message-scroller-button {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 10;
      }

      .cn-message-scroller-button[data-active="false"] {
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 8px) scale(0.95);
      }

      .cn-message-scroller-button[data-active="true"] {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .cn-message-scroller-button[data-direction="end"] {
        bottom: 0.75rem;
      }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-zinc-700 selection:text-white">
    <div id="root">
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#09090b;color:#a1a1aa;font-family:sans-serif;">
            <div style="text-align:center;">
                <div style="font-size:1.125rem;font-weight:600;color:#fafafa;margin-bottom:0.25rem;">
                    “Educational” games
                </div>
                <div style="font-size:0.8125rem;color:#71717a;">Loading hub...</div>
            </div>
        </div>
    </div>

    <!-- Pre-compiled application bundle -->
    <script src="./dist/home.bundle.js" onerror="this.onerror=null;this.src='./home.bundle.js';"></script>
</body>
</html>
