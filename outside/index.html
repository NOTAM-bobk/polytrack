<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outside games — "Education" Games</title>
    <meta name="description" content="Games and resources outside the education directory.">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="https://www.google.com/favicon.ico" sizes="any">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #09090b;
            color: #fafafa;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 8px 14px;
            border-bottom: 1px solid #27272a;
            background: rgba(9, 9, 11, 0.92);
            flex-shrink: 0;
        }

        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid #27272a;
            border-radius: 8px;
            color: #a1a1aa;
            font-size: 16px;
            line-height: 1;
            text-decoration: none;
        }

        .back:hover { color: #fafafa; border-color: #3f3f46; }

        h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .open {
            margin-left: auto;
            color: #a1a1aa;
            font-size: 12px;
            text-decoration: none;
            white-space: nowrap;
        }

        .open:hover { color: #fafafa; }

        iframe {
            flex: 1;
            width: 100%;
            min-height: 0;
            border: 0;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <a class="back" href="/" aria-label="Back to games">←</a>
        <h1>Outside games</h1>
        <a class="open" href="https://docs.google.com/document/d/1jweQVnz9hNeovsKgvJV6FY0RQptYj2rm28VsmZBEvL8/edit?tab=t.0" target="_blank" rel="noopener noreferrer">Open in Google Docs</a>
    </header>
    <iframe
        src="https://docs.google.com/document/d/1jweQVnz9hNeovsKgvJV6FY0RQptYj2rm28VsmZBEvL8/preview"
        title="Outside games"
        allowfullscreen
    ></iframe>
</body>
</html>
