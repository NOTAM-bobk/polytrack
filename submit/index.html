<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a URL</title>
    <meta name="description" content="Suggest a game or site for the Education Games hub.">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='3' fill='%23f7c24b'/%3E%3Cpath d='M9 6.5 18 12l-9 5.5z' fill='%230e1020'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --tarmac: #141628;
            --panel: #1f2340;
            --panel-top: #22274a;
            --chalk: #eef0f8;
            --slate: #9aa0bd;
            --hairline: #333a5f;
            --hairline-lit: #545e93;
            --signal: #f7c24b;
            --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
            --font-ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--chalk);
            background:
                radial-gradient(900px 520px at 20% -10%, #27315d 0%, rgba(39, 49, 93, 0) 62%),
                radial-gradient(720px 440px at 98% 4%, #1b2a4e 0%, rgba(27, 42, 78, 0) 60%),
                linear-gradient(180deg, #141628 0%, #101226 72%, #0d0f1e 100%);
            font-family: var(--font-ui);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .start-line {
            height: 10px;
            background-image: repeating-conic-gradient(
                from 0deg,
                rgba(238, 240, 248, 0.3) 0deg 90deg,
                rgba(238, 240, 248, 0) 90deg 180deg
            );
            background-size: 20px 20px;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 16px;
            width: min(720px, 100% - 40px);
            margin-inline: auto;
            padding-top: 18px;
            font-size: 14px;
        }

        .top a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--slate);
            text-decoration: none;
            font-weight: 500;
        }

        .top a:hover { color: var(--chalk); }
        .top .back { margin-left: auto; }

        main {
            flex: 1 0 auto;
            width: min(720px, 100% - 40px);
            margin-inline: auto;
            padding-block: clamp(24px, 5vh, 48px) 32px;
        }

        h1 {
            margin: 0 0 10px;
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 7vw, 3.1rem);
            font-weight: 700;
            line-height: 0.96;
            letter-spacing: -0.005em;
        }

        .lede {
            max-width: 56ch;
            margin: 0 0 clamp(20px, 3.5vh, 30px);
            color: var(--slate);
            font-size: 16px;
            line-height: 1.6;
        }

        .panel {
            border: 1px solid var(--hairline);
            border-left-width: 3px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--panel-top), var(--panel));
            padding: clamp(18px, 3vw, 26px);
        }

        .field + .field { margin-top: 18px; }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .field .hint {
            margin: 0 0 7px;
            color: var(--slate);
            font-size: 13.5px;
        }

        .field label .optional {
            margin-left: 8px;
            color: #828aa9;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0;
        }

        input[type="url"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--hairline);
            border-radius: 3px;
            background: rgba(18, 21, 38, 0.85);
            color: var(--chalk);
            font: inherit;
            font-size: 15px;
            transition: border-color 0.16s ease, background-color 0.16s ease;
        }

        textarea {
            min-height: 132px;
            resize: vertical;
            line-height: 1.55;
        }

        input::placeholder, textarea::placeholder { color: #6f7795; }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--hairline-lit);
            background: rgba(22, 26, 46, 0.95);
        }

        input:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 1px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--hairline);
        }

        .send {
            padding: 11px 22px;
            border: 1px solid var(--signal);
            border-radius: 3px;
            background: var(--signal);
            color: #14162a;
            font: inherit;
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
        }

        .send:hover { background: #ffd06a; border-color: #ffd06a; }
        .send:active { transform: translateY(1px); }
        .send[disabled] { opacity: 0.55; cursor: progress; }

        .send:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }

        .status {
            min-height: 1.4em;
            margin: 0;
            font-size: 14px;
            color: var(--slate);
        }

        .status[data-tone="ok"] { color: #9fe0b0; }
        .status[data-tone="bad"] { color: #f3a08f; }

        .done {
            border: 1px solid var(--hairline);
            border-left: 3px solid var(--signal);
            border-radius: 3px;
            background: linear-gradient(180deg, var(--panel-top), var(--panel));
            padding: clamp(20px, 3vw, 28px);
        }

        .done h2 {
            margin: 0 0 8px;
            font-family: var(--font-display);
            font-size: 1.7rem;
            font-weight: 600;
        }

        .done p { margin: 0 0 18px; color: var(--slate); }

        .again {
            padding: 9px 16px;
            border: 1px solid var(--hairline-lit);
            border-radius: 3px;
            background: transparent;
            color: var(--chalk);
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .again:hover { border-color: var(--signal); color: var(--signal); }

        .bottom {
            flex: 0 0 auto;
            width: min(720px, 100% - 40px);
            margin-inline: auto;
            padding: 16px 0 22px;
            border-top: 1px solid var(--hairline);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .bottom p {
            margin: 0;
            color: #6f7795;
            font-size: 12.5px;
            line-height: 1.5;
        }

        .admin-open {
            margin-left: auto;
            padding: 7px 12px;
            border: 1px solid var(--hairline);
            border-radius: 3px;
            background: rgba(31, 35, 64, 0.6);
            color: var(--slate);
            font: inherit;
            font-size: 12.5px;
            cursor: pointer;
            white-space: nowrap;
        }

        .admin-open:hover { color: var(--chalk); border-color: var(--hairline-lit); }

        /* ---------- admin dialog ---------- */

        dialog {
            width: min(760px, 100% - 32px);
            max-height: min(84vh, 900px);
            padding: 0;
            border: 1px solid var(--hairline-lit);
            border-radius: 4px;
            background: linear-gradient(180deg, #1c2139, #161a2d);
            color: var(--chalk);
            overflow: hidden;
        }

        dialog::backdrop { background: rgba(8, 9, 18, 0.74); }

        .admin {
            display: flex;
            flex-direction: column;
            max-height: min(84vh, 900px);
        }

        .admin__head {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--hairline);
        }

        .admin__head h2 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .admin__count {
            margin-left: auto;
            color: var(--slate);
            font-size: 13px;
        }

        .admin__close {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: 1px solid var(--hairline);
            border-radius: 3px;
            background: transparent;
            color: var(--slate);
            font: inherit;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
        }

        .admin__close:hover { color: var(--chalk); border-color: var(--hairline-lit); }

        .admin__body { padding: 18px; overflow-y: auto; }

        .lock {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }

        .lock .field { flex: 1 1 220px; margin: 0; }
        .lock input { font-size: 14px; }

        .lock button {
            padding: 10px 18px;
            border: 1px solid var(--signal);
            border-radius: 3px;
            background: var(--signal);
            color: #14162a;
            font: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .lock button:hover { background: #ffd06a; border-color: #ffd06a; }

        .admin__note {
            margin: 12px 0 0;
            color: var(--slate);
            font-size: 13.5px;
        }

        .admin__note[data-tone="bad"] { color: #f3a08f; }

        .entries { margin: 0; padding: 0; list-style: none; }

        .entry {
            padding: 13px 0;
            border-bottom: 1px solid var(--hairline);
        }

        .entry:first-child { padding-top: 0; }
        .entry:last-child { border-bottom: 0; padding-bottom: 0; }

        .entry__meta {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 5px;
            color: #828aa9;
            font-size: 12.5px;
            font-variant-numeric: tabular-nums;
        }

        .entry__id { color: var(--signal); font-weight: 600; }

        .entry__link {
            display: block;
            margin-bottom: 4px;
            color: #8fc4ff;
            font-size: 13.5px;
            word-break: break-all;
        }

        .entry__text {
            margin: 0;
            color: var(--chalk);
            font-size: 14.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty {
            margin: 0;
            padding: 18px 0;
            color: var(--slate);
            font-size: 14.5px;
        }

        @media (max-width: 520px) {
            .bottom { flex-wrap: wrap; }
            .admin-open { margin-left: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="start-line" aria-hidden="true"></div>

    <header class="top">
        <a href="https://edugame.benlaunches.icu/">Education Games</a>
        <a class="back" href="https://edugame.benlaunches.icu/">Back to the hub</a>
    </header>

    <main>
        <h1>Suggest something</h1>
        <p class="lede">A game, a site, a mirror worth keeping. A link helps; a sentence about why it belongs here helps more.</p>

        <div id="stage">
            <form class="panel" id="form" novalidate>
                <div class="field">
                    <label for="url">Link<span class="optional">optional</span></label>
                    <p class="hint">Paste the address if you have one. No need to type https://.</p>
                    <input id="url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="example.com/game" maxlength="500">
                </div>

                <div class="field">
                    <label for="message">What should we add?</label>
                    <textarea id="message" name="message" rows="5" maxlength="2000" placeholder="Name of the game or site, and what it is." required></textarea>
                </div>

                <div class="actions">
                    <button class="send" type="submit" id="send">Send</button>
                    <p class="status" id="status" role="status" aria-live="polite"></p>
                </div>
            </form>
        </div>
    </main>

    <footer class="bottom">
        <p>Submissions are saved and read by one person, when there is time.</p>
        <button class="admin-open" type="button" id="admin-open">Admin</button>
    </footer>

    <dialog id="admin" aria-labelledby="admin-title">
        <div class="admin">
            <div class="admin__head">
                <h2 id="admin-title">Submissions</h2>
                <span class="admin__count" id="admin-count"></span>
                <button class="admin__close" type="button" id="admin-close" aria-label="Close">×</button>
            </div>

            <div class="admin__body" id="admin-body">
                <form class="lock" id="lock">
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit">Open</button>
                </form>
                <p class="admin__note" id="admin-note" role="status" aria-live="polite"></p>
                <ul class="entries" id="entries" hidden></ul>
            </div>
        </div>
    </dialog>

    <script>
        (function () {
            "use strict";

            var API = "https://site-8e1a65ea314847678f5a380c27e2ddd9.freebuff.page";
            var SESSION_KEY = "submit.admin.v1";

            var form = document.getElementById("form");
            var stage = document.getElementById("stage");
            var status = document.getElementById("status");
            var send = document.getElementById("send");
            var urlInput = document.getElementById("url");
            var messageInput = document.getElementById("message");

            var dialog = document.getElementById("admin");
            var openButton = document.getElementById("admin-open");
            var closeButton = document.getElementById("admin-close");
            var lockForm = document.getElementById("lock");
            var passwordInput = document.getElementById("password");
            var note = document.getElementById("admin-note");
            var entries = document.getElementById("entries");
            var countLabel = document.getElementById("admin-count");

            function say(text, tone) {
                status.textContent = text || "";
                if (tone) { status.setAttribute("data-tone", tone); }
                else { status.removeAttribute("data-tone"); }
            }

            function noteSay(text, tone) {
                note.textContent = text || "";
                if (tone) { note.setAttribute("data-tone", tone); }
                else { note.removeAttribute("data-tone"); }
            }

            form.addEventListener("submit", function (event) {
                event.preventDefault();

                var message = messageInput.value.trim();
                var link = urlInput.value.trim();

                if (message.length < 3) {
                    say("Add a few words so we know what this is.", "bad");
                    messageInput.focus();
                    return;
                }

                send.disabled = true;
                say("Sending…");

                fetch(API + "/api/submit", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ url: link, message: message })
                }).then(function (response) {
                    return response.json().catch(function () { return {}; }).then(function (data) {
                        return { response: response, data: data };
                    });
                }).then(function (result) {
                    if (!result.response.ok) {
                        throw new Error(result.data && result.data.error ? result.data.error : "Something went wrong saving that.");
                    }
                    sent();
                }).catch(function (error) {
                    send.disabled = false;
                    say(error && error.message ? error.message : "Could not reach the server. Try again.", "bad");
                });
            });

            function sent() {
                stage.innerHTML = '<div class="done" role="status">'
                    + "<h2>Sent</h2>"
                    + "<p>It is saved. Thanks — suggestions get read in batches, not instantly.</p>"
                    + '<button class="again" type="button" id="again">Suggest another</button>'
                    + "</div>";
                document.getElementById("again").addEventListener("click", function () {
                    reset();
                });
            }

            function reset() {
                stage.innerHTML = '';
                stage.appendChild(form);
                form.reset();
                send.disabled = false;
                say("");
                messageInput.focus();
            }

            /* ---------- admin ---------- */

            function readPassword() {
                try { return sessionStorage.getItem(SESSION_KEY) || ""; } catch (error) { return ""; }
            }

            function savePassword(value) {
                try {
                    if (value) { sessionStorage.setItem(SESSION_KEY, value); }
                    else { sessionStorage.removeItem(SESSION_KEY); }
                } catch (error) { /* private mode */ }
            }

            function renderEntries(items) {
                entries.innerHTML = "";
                if (!items.length) {
                    entries.hidden = true;
                    noteSay("Nothing submitted yet.", "");
                    return;
                }

                var fragment = document.createDocumentFragment();
                items.forEach(function (item) {
                    var li = document.createElement("li");
                    li.className = "entry";

                    var meta = document.createElement("div");
                    meta.className = "entry__meta";

                    var id = document.createElement("span");
                    id.className = "entry__id";
                    id.textContent = "#" + item.id;

                    var when = document.createElement("span");
                    when.textContent = formatDate(item.createdAt);

                    meta.appendChild(id);
                    meta.appendChild(when);
                    li.appendChild(meta);

                    if (item.url) {
                        var link = document.createElement("a");
                        link.className = "entry__link";
                        link.href = item.url;
                        link.target = "_blank";
                        link.rel = "noopener noreferrer nofollow";
                        link.textContent = item.url;
                        li.appendChild(link);
                    }

                    var text = document.createElement("p");
                    text.className = "entry__text";
                    text.textContent = item.message;
                    li.appendChild(text);

                    fragment.appendChild(li);
                });

                entries.innerHTML = "";
                entries.appendChild(fragment);
                entries.hidden = false;
                noteSay("");
            }

            function formatDate(value) {
                if (!value) { return ""; }
                var date = new Date(value);
                if (isNaN(date.getTime())) { return String(value); }
                return date.toLocaleString(undefined, {
                    year: "numeric", month: "short", day: "numeric",
                    hour: "2-digit", minute: "2-digit"
                });
            }

            function load(password) {
                noteSay("Loading…");
                return fetch(API + "/api/admin/list", {
                    method: "POST",
                    headers: {
                        "content-type": "application/json",
                        "x-admin-password": password
                    },
                    body: "{}"
                }).then(function (response) {
                    return response.json().catch(function () { return {}; }).then(function (data) {
                        return { response: response, data: data };
                    });
                }).then(function (result) {
                    if (result.response.status === 401) {
                        savePassword("");
                        lockForm.hidden = false;
                        entries.hidden = true;
                        countLabel.textContent = "";
                        throw new Error("Wrong password.");
                    }
                    if (result.response.status === 503) {
                        lockForm.hidden = false;
                        entries.hidden = true;
                        throw new Error(result.data.error || "The admin password is not set on the server yet.");
                    }
                    if (!result.response.ok) {
                        throw new Error(result.data && result.data.error ? result.data.error : "Could not load submissions.");
                    }

                    savePassword(password);
                    lockForm.hidden = true;
                    countLabel.textContent = result.data.total + (result.data.total === 1 ? " entry" : " entries");
                    renderEntries(result.data.items || []);
                }).catch(function (error) {
                    noteSay(error && error.message ? error.message : "Could not reach the server.", "bad");
                });
            }

            openButton.addEventListener("click", function () {
                var known = readPassword();
                if (!known) {
                    lockForm.hidden = false;
                    entries.hidden = true;
                    noteSay("");
                }
                if (typeof dialog.showModal === "function") { dialog.showModal(); }
                else { dialog.setAttribute("open", ""); }

                if (known) { load(known); }
                else { passwordInput.focus(); }
            });

            closeButton.addEventListener("click", function () { dialog.close(); });

            dialog.addEventListener("click", function (event) {
                if (event.target === dialog) { dialog.close(); }
            });

            lockForm.addEventListener("submit", function (event) {
                event.preventDefault();
                var password = passwordInput.value;
                if (!password) { return; }
                load(password).then(function () { passwordInput.value = ""; });
            });

            /* A stale password in a background tab should not keep the panel locked open. */
            window.addEventListener("pagehide", function () { dialog.close(); });
        })();
    </script>
</body>
</html>
