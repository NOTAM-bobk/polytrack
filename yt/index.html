<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTube</title>
    <meta name="description" content="Search and watch videos from the Education Games hub. No youtube.com required.">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='3' fill='%23f7c24b'/%3E%3Cpath d='M9 6.5 18 12l-9 5.5z' fill='%230e1020'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #0d0f1d;
            --ink-lift: #121526;
            --surface: #181c31;
            --surface-top: #1d2239;
            --line: #2b3152;
            --line-lit: #454f80;
            --paper: #eef0f8;
            --muted: #9aa0bd;
            --faint: #737a9c;
            --signal: #f7c24b;
            --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
            --font-ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
            --radius: 3px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { scrollbar-color: #39406a transparent; scrollbar-width: thin; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--paper);
            background:
                radial-gradient(1100px 600px at 12% -12%, #232c52 0%, rgba(35, 44, 82, 0) 60%),
                radial-gradient(900px 500px at 100% -6%, #1a2344 0%, rgba(26, 35, 68, 0) 58%),
                linear-gradient(180deg, #0f1222 0%, var(--ink) 55%, #0a0c17 100%);
            background-attachment: fixed;
            font-family: var(--font-ui);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 3px;
            border-radius: 1px;
        }

        /* ---------- top bar ---------- */

        .bar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: clamp(12px, 2.5vw, 28px);
            padding: 12px clamp(16px, 4vw, 40px);
            border-bottom: 1px solid var(--line);
            background: rgba(13, 15, 29, 0.86);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
        }

        .word {
            display: flex;
            align-items: center;
            gap: 9px;
            flex: 0 0 auto;
            font-family: var(--font-display);
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1;
            text-decoration: none;
            white-space: nowrap;
        }

        .word svg { display: block; width: 24px; height: 24px; }

        .find {
            display: flex;
            flex: 1 1 auto;
            max-width: 620px;
            min-width: 0;
        }

        .find input {
            flex: 1 1 auto;
            min-width: 0;
            height: 40px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-right: 0;
            border-radius: var(--radius) 0 0 var(--radius);
            background: rgba(24, 28, 49, 0.9);
            color: var(--paper);
            font: inherit;
            font-size: 15px;
            appearance: none;
            transition: border-color 0.16s ease, background-color 0.16s ease;
        }

        .find input::placeholder { color: var(--faint); }

        .find input:focus {
            outline: none;
            border-color: var(--line-lit);
            background: #1b2038;
        }

        .find input:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }

        .find button {
            display: grid;
            place-items: center;
            width: 46px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 0 var(--radius) var(--radius) 0;
            background: var(--surface-top);
            color: var(--muted);
            cursor: pointer;
            transition: color 0.16s ease, border-color 0.16s ease;
        }

        .find button:hover { color: var(--signal); border-color: var(--line-lit); }
        .find button svg { width: 17px; height: 17px; }

        .bar nav {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
        }

        .bar nav a { text-decoration: none; }
        .bar nav a:hover { color: var(--paper); }

        /* ---------- shell ---------- */

        .view {
            width: min(1360px, 100% - clamp(32px, 8vw, 80px));
            margin-inline: auto;
            padding-block: clamp(20px, 3.5vw, 34px) 72px;
        }

        .chips {
            display: flex;
            gap: 8px;
            margin: 0 0 clamp(22px, 3vw, 32px);
            padding: 0 0 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar { display: none; }

        .chip {
            flex: 0 0 auto;
            padding: 7px 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(24, 28, 49, 0.55);
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
        }

        .chip:hover { color: var(--paper); border-color: var(--line-lit); }

        .chip[aria-current="page"] {
            border-color: var(--signal);
            background: var(--signal);
            color: #14162a;
        }

        .row + .row { margin-top: clamp(28px, 4vw, 44px); }

        .row__head {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin: 0 0 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
        }

        .row__head h2 {
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 2.4vw, 1.75rem);
            font-weight: 600;
            letter-spacing: 0.005em;
            line-height: 1.1;
        }

        .row__head p {
            margin: 0;
            color: var(--faint);
            font-size: 14px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
            gap: 24px 18px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* ---------- cards ---------- */

        .card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
            text-decoration: none;
        }

        .card__thumb {
            position: relative;
            display: block;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            transition: border-color 0.16s ease;
        }

        .card__thumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.18s ease;
        }

        .card__play {
            position: absolute;
            left: 9px;
            bottom: 9px;
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            border-radius: 2px;
            background: var(--signal);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .card__play::after {
            content: "";
            border-left: 8px solid #14162a;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            margin-left: 2px;
        }

        .card:hover .card__thumb { border-color: var(--line-lit); }
        .card:hover .card__thumb img { filter: brightness(1.07); }
        .card:hover .card__play { opacity: 1; transform: none; }
        .card:hover .card__title { color: #fff; }

        .time {
            position: absolute;
            right: 8px;
            bottom: 8px;
            padding: 1px 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            background: rgba(10, 12, 24, 0.88);
            color: var(--paper);
            font-family: var(--font-display);
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.03em;
            line-height: 1.4;
            font-variant-numeric: tabular-nums;
        }

        .time--live {
            border-color: transparent;
            background: var(--signal);
            color: #14162a;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .card__body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

        .card__title {
            display: -webkit-box;
            overflow: hidden;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            color: var(--paper);
            font-size: 15px;
            font-weight: 500;
            line-height: 1.34;
            transition: color 0.16s ease;
        }

        .card__meta,
        .card__when {
            color: var(--faint);
            font-size: 13px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card__meta { display: flex; align-items: center; gap: 8px; }

        .card__meta > span + span {
            padding-left: 8px;
            border-left: 1px solid var(--line);
        }

        /* ---------- watch ---------- */

        .watch {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 372px;
            gap: clamp(22px, 3vw, 40px);
            align-items: start;
        }

        .watch__main { min-width: 0; }

        .screen {
            position: relative;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #05060d;
            overflow: hidden;
        }

        .screen iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .screen__note {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            gap: 6px;
            padding: 20px;
            text-align: center;
            color: var(--faint);
            font-size: 14px;
        }

        .watch__title {
            margin: 18px 0 0;
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 2.6vw, 2.05rem);
            font-weight: 600;
            line-height: 1.16;
            letter-spacing: 0.002em;
            text-wrap: balance;
        }

        .watch__by {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }

        .watch__by img {
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: var(--surface);
            object-fit: cover;
        }

        .watch__who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .watch__who b { font-size: 15px; font-weight: 600; }
        .watch__who span { color: var(--faint); font-size: 13px; }

        .watch__tools {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--paper);
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.16s ease, color 0.16s ease;
        }

        .btn:hover { border-color: var(--line-lit); }

        .btn[aria-pressed="true"] {
            border-color: var(--signal);
            color: var(--signal);
        }

        .btn--plain { background: transparent; }

        .label {
            margin: 22px 0 8px;
            color: var(--faint);
            font-size: 13px;
            font-weight: 500;
        }

        .desc {
            position: relative;
            margin: 0;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(24, 28, 49, 0.45);
            color: var(--muted);
            font-size: 14px;
            line-height: 1.62;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .desc--clamped {
            display: -webkit-box;
            overflow: hidden;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .watch__aside { min-width: 0; }

        .list { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }

        .rowitem {
            display: grid;
            grid-template-columns: 158px minmax(0, 1fr);
            gap: 11px;
            text-decoration: none;
        }

        .rowitem__thumb {
            position: relative;
            display: block;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: var(--surface);
            transition: border-color 0.16s ease;
        }

        .rowitem__thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .rowitem:hover .rowitem__thumb { border-color: var(--line-lit); }
        .rowitem:hover .rowitem__title { color: #fff; }

        .rowitem__thumb .time { font-size: 11.5px; right: 5px; bottom: 5px; }

        .rowitem__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

        .rowitem__title {
            display: -webkit-box;
            overflow: hidden;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.32;
        }

        .rowitem__meta {
            color: var(--faint);
            font-size: 12.5px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---------- states ---------- */

        .state {
            display: grid;
            gap: 10px;
            justify-items: start;
            max-width: 62ch;
            margin: clamp(28px, 6vw, 64px) auto;
            padding: clamp(22px, 3vw, 30px);
            border: 1px solid var(--line);
            border-left: 3px solid var(--signal);
            border-radius: var(--radius);
            background: linear-gradient(180deg, var(--surface-top), var(--surface));
        }

        .state h2 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .state p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
        .state p a { color: var(--signal); }

        .skeleton {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: linear-gradient(100deg, #161a2e 30%, #1f2540 50%, #161a2e 70%);
            background-size: 220% 100%;
            animation: sweep 1.5s linear infinite;
        }

        @keyframes sweep {
            from { background-position: 120% 0; }
            to { background-position: -120% 0; }
        }

        .skcard { display: flex; flex-direction: column; gap: 10px; }
        .skcard .skeleton:first-child { aspect-ratio: 16 / 9; }
        .skcard .skeleton:not(:first-child) { height: 12px; }

        .foot {
            width: min(1360px, 100% - clamp(32px, 8vw, 80px));
            margin-inline: auto;
            padding: 20px 0 34px;
            border-top: 1px solid var(--line);
            color: var(--faint);
            font-size: 13px;
            line-height: 1.6;
        }

        .foot a { color: var(--muted); }

        @media (max-width: 980px) {
            .watch { grid-template-columns: minmax(0, 1fr); }
            .rowitem { grid-template-columns: 148px minmax(0, 1fr); }
        }

        @media (max-width: 720px) {
            .bar { flex-wrap: wrap; gap: 10px 14px; }
            .find { order: 3; flex-basis: 100%; max-width: none; }
            .bar nav { margin-left: auto; gap: 14px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px 12px; }
            .card__title { font-size: 14px; }
            .card__meta, .card__when { font-size: 12.5px; }
            .watch__title { margin-top: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="bar">
        <a class="word" href="#/">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect width="24" height="24" rx="3" fill="#f7c24b"/>
                <path d="M9 6.5 18 12l-9 5.5z" fill="#0d0f1d"/>
            </svg>
            OpenTube
        </a>

        <form class="find" id="find" role="search" autocomplete="off">
            <input id="q" type="search" name="q" placeholder="Search videos" aria-label="Search videos" enterkeyhint="search">
            <button type="submit" aria-label="Search">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false">
                    <circle cx="7.75" cy="7.75" r="5.25"/>
                    <line x1="11.75" y1="11.75" x2="16" y2="16"/>
                </svg>
            </button>
        </form>

        <nav aria-label="Elsewhere">
            <a href="https://edugame.benlaunches.icu/">Games</a>
            <a href="https://proxy.benlaunches.icu">Proxy</a>
        </nav>
    </header>

    <main class="view" id="view" aria-live="polite">
        <p class="label">Loading the guide…</p>
    </main>

    <footer class="foot">
        <p>OpenTube reads public video data through community mirrors and plays video in the official embed player. Nothing is hosted here, and playback counts toward the original video on YouTube.</p>
    </footer>

    <noscript>
        <p class="foot">OpenTube needs JavaScript to search and play videos.</p>
    </noscript>

    <script>
        (function () {
            "use strict";

            /* Piped-compatible API mirrors, checked for open CORS. Volunteers run
               these, so any of them can disappear; the app races them and remembers
               whichever answered last. */
            var INSTANCES = [
                "https://api.piped.private.coffee",
                "https://pipedapi.ducks.party"
            ];

            var TAGS = [
                { id: "trending", label: "Trending" },
                { id: "lofi", label: "Study lo-fi", q: "lofi hip hop radio" },
                { id: "music", label: "Music", q: "official music video" },
                { id: "gaming", label: "Gaming", q: "gameplay no commentary" },
                { id: "tech", label: "Tech", q: "tech review" },
                { id: "science", label: "Science", q: "science explained" },
                { id: "sports", label: "Sports", q: "sports highlights" },
                { id: "comedy", label: "Comedy", q: "comedy sketch" },
                { id: "news", label: "News", q: "news today" }
            ];

            var TIMEOUT = 8000;
            var HISTORY_KEY = "ot.history.v1";
            var INSTANCE_KEY = "ot.instance.v1";

            var view = document.getElementById("view");
            var form = document.getElementById("find");
            var input = document.getElementById("q");

            var preferred = readStore(INSTANCE_KEY);
            var items = new Map();
            var feeds = new Map();
            var renderToken = 0;

            /* ---------- storage ---------- */

            function readStore(key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            }

            function writeStore(key, value) {
                try {
                    if (value === null) { localStorage.removeItem(key); }
                    else { localStorage.setItem(key, value); }
                } catch (e) { /* private mode */ }
            }

            function readHistory() {
                try {
                    var raw = JSON.parse(readStore(HISTORY_KEY) || "[]");
                    return Array.isArray(raw) ? raw.slice(0, 12) : [];
                } catch (e) { return []; }
            }

            function pushHistory(record) {
                var next = readHistory().filter(function (entry) { return entry.id !== record.id; });
                next.unshift(record);
                writeStore(HISTORY_KEY, JSON.stringify(next.slice(0, 12)));
            }

            function rememberInstance(base) {
                preferred = base;
                writeStore(INSTANCE_KEY, base);
            }

            /* ---------- api ---------- */

            function request(base, path) {
                var controller = new AbortController();
                var timer = setTimeout(function () { controller.abort(); }, TIMEOUT);

                return fetch(base + path, {
                    signal: controller.signal,
                    headers: { Accept: "application/json" }
                }).then(function (response) {
                    if (!response.ok) { throw new Error("HTTP " + response.status); }
                    return response.json();
                }).then(function (data) {
                    clearTimeout(timer);
                    if (!data || data.error) {
                        throw new Error((data && data.error) || "empty response");
                    }
                    return data;
                }).catch(function (error) {
                    clearTimeout(timer);
                    throw error;
                });
            }

            function api(path) {
                var order = preferred
                    ? [preferred].concat(INSTANCES.filter(function (base) { return base !== preferred; }))
                    : INSTANCES.slice();

                var index = 0;

                function attempt() {
                    if (index >= order.length) {
                        return Promise.reject(new Error("Every video source failed."));
                    }
                    var base = order[index++];
                    return request(base, path).then(function (data) {
                        rememberInstance(base);
                        return data;
                    }).catch(attempt);
                }

                return attempt();
            }

            /* First paint races all mirrors; the fastest healthy one wins. */
            function apiRace(path) {
                if (preferred) {
                    return request(preferred, path).catch(function () { return null; })
                        .then(function (data) { return data || raceRest(); });
                }
                return raceRest();

                function raceRest() {
                    var attempts = INSTANCES.map(function (base) {
                        return request(base, path).then(function (data) {
                            rememberInstance(base);
                            return data;
                        });
                    });

                    if (typeof Promise.any === "function") {
                        return Promise.any(attempts);
                    }

                    return new Promise(function (resolve, reject) {
                        var pending = attempts.length;
                        var failed = 0;
                        attempts.forEach(function (p) {
                            p.then(resolve, function () {
                                failed += 1;
                                if (failed === pending) { reject(new Error("No source answered.")); }
                            });
                        });
                    });
                }
            }

            /* ---------- formatting ---------- */

            function esc(value) {
                return String(value === null || value === undefined ? "" : value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function videoId(url) {
                if (!url) { return ""; }
                var match = /(?:v=|\/shorts\/|\/embed\/|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(String(url));
                return match ? match[1] : "";
            }

            function duration(seconds) {
                if (typeof seconds !== "number" || seconds <= 0) { return ""; }
                var total = Math.round(seconds);
                var hours = Math.floor(total / 3600);
                var minutes = Math.floor((total % 3600) / 60);
                var secs = total % 60;
                var tail = String(secs);
                if (tail.length < 2) { tail = "0" + tail; }
                if (hours > 0) {
                    return hours + ":" + String(minutes).padStart(2, "0") + ":" + tail;
                }
                return minutes + ":" + tail;
            }

            function count(value) {
                if (typeof value !== "number" || value < 0) { return ""; }
                if (value >= 1e9) { return trim(value / 1e9) + "B"; }
                if (value >= 1e6) { return trim(value / 1e6) + "M"; }
                if (value >= 1e3) { return trim(value / 1e3) + "K"; }
                return String(value);
            }

            function trim(number) {
                var fixed = number < 10 ? number.toFixed(1) : Math.round(number).toString();
                return fixed.replace(/\.0$/, "");
            }

            function when(item) {
                if (typeof item.uploaded === "number" && item.uploaded > 0) {
                    var days = Math.floor((Date.now() - item.uploaded) / 86400000);
                    if (days <= 0) { return "today"; }
                    if (days === 1) { return "yesterday"; }
                    if (days < 30) { return days + " days ago"; }
                    if (days < 365) { return Math.max(1, Math.round(days / 30)) + " months ago"; }
                    return Math.max(1, Math.round(days / 365)) + " years ago";
                }
                var label = String(item.uploadedDate || "").replace(/^Streamed\s+/i, "");
                return label.charAt(0).toLowerCase() + label.slice(1);
            }

            function thumbFor(item, id) {
                return item.thumbnail || ("https://i.ytimg.com/vi/" + id + "/hqdefault.jpg");
            }

            function badge(item) {
                if (item.duration === -1 || item.livestream) {
                    return '<span class="time time--live">Live</span>';
                }
                var text = duration(item.duration);
                return text ? '<span class="time">' + esc(text) + "</span>" : "";
            }

            /* ---------- markup ---------- */

            function card(item) {
                var id = videoId(item.url);
                if (!id || item.type === "channel" || item.type === "playlist") { return ""; }

                items.set(id, item);

                var channel = item.uploaderName || item.uploader || "";
                var views = count(item.views);
                var meta = [];
                if (channel) { meta.push("<span>" + esc(channel) + "</span>"); }
                if (views) { meta.push("<span>" + esc(views) + " views</span>"); }
                var stamp = when(item);

                return '<li><a class="card" href="#/watch/' + esc(id) + '">'
                    + '<span class="card__thumb">'
                    + '<img src="' + esc(thumbFor(item, id)) + '" alt="" loading="lazy" decoding="async"'
                    + ' onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' + esc(id) + '/hqdefault.jpg\';">'
                    + badge(item)
                    + '<span class="card__play" aria-hidden="true"></span>'
                    + "</span>"
                    + '<span class="card__body">'
                    + '<span class="card__title">' + esc(item.title || "Untitled") + "</span>"
                    + (meta.length ? '<span class="card__meta">' + meta.join("") + "</span>" : "")
                    + (stamp ? '<span class="card__when">' + esc(stamp) + "</span>" : "")
                    + "</span></a></li>";
            }

            function grid(list) {
                var cards = list.map(card).join("");
                return cards ? '<ul class="grid">' + cards + "</ul>" : "";
            }

            function row(title, subtitle, list, emptyText) {
                var body = grid(list);
                if (!body) {
                    if (!emptyText) { return ""; }
                    body = '<p class="card__meta">' + esc(emptyText) + "</p>";
                }
                return '<section class="row">'
                    + '<div class="row__head"><h2>' + esc(title) + "</h2>"
                    + (subtitle ? "<p>" + esc(subtitle) + "</p>" : "")
                    + "</div>" + body + "</section>";
            }

            function rowItem(item) {
                var id = videoId(item.url);
                if (!id) { return ""; }
                items.set(id, item);

                var channel = item.uploaderName || item.uploader || "";
                var views = count(item.views);
                var stamp = when(item);
                var meta = [channel, views ? views + " views" : "", stamp]
                    .filter(Boolean).join("  ·  ");

                return '<li><a class="rowitem" href="#/watch/' + esc(id) + '">'
                    + '<span class="rowitem__thumb">'
                    + '<img src="' + esc(thumbFor(item, id)) + '" alt="" loading="lazy" decoding="async"'
                    + ' onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' + esc(id) + '/hqdefault.jpg\';">'
                    + badge(item)
                    + "</span>"
                    + '<span class="rowitem__body">'
                    + '<span class="rowitem__title">' + esc(item.title || "Untitled") + "</span>"
                    + '<span class="rowitem__meta">' + esc(meta) + "</span>"
                    + "</span></a></li>";
            }

            function chips(activeId) {
                return '<nav class="chips" aria-label="Browse">' + TAGS.map(function (tag) {
                    var href = tag.id === "trending" ? "#/" : "#/tag/" + tag.id;
                    var current = tag.id === activeId ? ' aria-current="page"' : "";
                    return '<a class="chip" href="' + href + '"' + current + ">" + esc(tag.label) + "</a>";
                }).join("") + "</nav>";
            }

            function skeletonRow(count) {
                var cells = "";
                for (var i = 0; i < count; i += 1) {
                    cells += '<li class="skcard"><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton" style="width:60%"></span></li>';
                }
                return '<div class="row"><div class="row__head"><h2>&nbsp;</h2></div><ul class="grid">' + cells + "</ul></div>";
            }

            function failure(error) {
                var detail = (error && error.message) ? error.message : "";
                return '<div class="state">'
                    + "<h2>No video source answered</h2>"
                    + "<p>The mirrors that serve search results did not respond"
                    + (detail ? ' <span class="card__meta">(' + esc(detail) + ")</span>" : "")
                    + ". They are run by volunteers and do go down.</p>"
                    + '<p><button class="btn" type="button" id="retry">Try again</button></p>'
                    + '<p>If every mirror is blocked here too, the <a href="https://proxy.benlaunches.icu">hub proxy</a> is the fallback.</p>'
                    + "</div>";
            }

            function showError(error) {
                view.innerHTML = chips("") + failure(error);
                var retry = document.getElementById("retry");
                if (retry) { retry.addEventListener("click", function () { feeds.clear(); render(); }); }
            }

            /* ---------- routes ---------- */

            function parseRoute() {
                var raw = location.hash.replace(/^#\/?/, "");
                var parts = raw.split("/");
                var kind = parts.shift() || "";
                var arg = decodeURIComponent(parts.join("/"));

                if (kind === "watch" && arg) { return { name: "watch", id: arg }; }
                if (kind === "search" && arg) { return { name: "search", query: arg }; }
                if (kind === "tag" && arg) { return { name: "tag", id: arg }; }
                return { name: "guide" };
            }

            function tagFor(id) {
                return TAGS.filter(function (tag) { return tag.id === id; })[0] || null;
            }

            function render() {
                var route = parseRoute();
                var token = ++renderToken;

                window.scrollTo(0, 0);

                if (route.name === "watch") {
                    document.title = "Watching · OpenTube";
                    return renderWatch(route.id, token);
                }

                if (route.name === "search") {
                    document.title = route.query + " · OpenTube";
                    if (input.value !== route.query) { input.value = route.query; }
                    return renderFeed(route.query, "Results for “" + route.query + "”", "", token);
                }

                if (route.name === "tag") {
                    var tag = tagFor(route.id);
                    var query = tag && tag.q ? tag.q : route.id;
                    document.title = (tag ? tag.label : route.id) + " · OpenTube";
                    return renderFeed(query, tag ? tag.label : route.id, "Popular picks for this shelf", token);
                }

                document.title = "OpenTube";
                return renderGuide(token);
            }

            function renderGuide(token) {
                var history = readHistory();
                view.innerHTML = chips("trending")
                    + (history.length ? historyRow(history) : "")
                    + '<div id="guide">' + skeletonRow(8) + "</div>";

                apiRace("/trending?region=US").then(function (data) {
                    if (token !== renderToken) { return; }
                    var list = (data || []).filter(function (item) {
                        return item && item.type === "stream" && videoId(item.url);
                    });
                    var target = document.getElementById("guide");
                    if (!target) { return; }
                    target.innerHTML = row("Trending now", "Most watched right now across the mirrors", list, "Nothing came back from the guide.");
                }).catch(function (error) {
                    if (token !== renderToken) { return; }
                    showError(error);
                });
            }

            function historyRow(history) {
                var list = history.map(function (entry) {
                    return {
                        url: "/watch?v=" + entry.id,
                        title: entry.title,
                        uploaderName: entry.channel,
                        thumbnail: entry.thumbnail,
                        type: "stream"
                    };
                });
                return row("Pick back up", "Where you left off", list, "");
            }

            function renderFeed(query, title, subtitle, token) {
                var key = "q:" + query;
                var cached = feeds.get(key);

                view.innerHTML = chips(tagFor(parseRoute().id) ? parseRoute().id : "")
                    + '<div id="feed">' + (cached ? "" : skeletonRow(8)) + "</div>";

                if (cached) {
                    paint(cached);
                    return;
                }

                api("/search?q=" + encodeURIComponent(query) + "&filter=videos").then(function (data) {
                    if (token !== renderToken) { return; }
                    var list = (data.items || []).filter(function (item) {
                        return item && item.type === "stream" && videoId(item.url);
                    });
                    feeds.set(key, list);
                    paint(list);
                }).catch(function (error) {
                    if (token !== renderToken) { return; }
                    showError(error);
                });

                function paint(list) {
                    var target = document.getElementById("feed");
                    if (!target) { return; }
                    target.innerHTML = row(title, subtitle, list, "No videos matched. Try fewer or plainer words.");
                }
            }

            /* ---------- watch ---------- */

            function loadVideo(id) {
                var known = items.get(id);
                if (known) { return Promise.resolve(known); }

                return api("/streams/" + id).then(function (data) {
                    var item = {
                        url: "/watch?v=" + id,
                        title: data.title,
                        uploaderName: data.uploader,
                        uploaderAvatar: data.uploaderAvatar,
                        thumbnail: data.thumbnailUrl,
                        duration: data.duration,
                        views: data.views,
                        uploaded: data.uploaded,
                        uploadedDate: data.uploadDate,
                        shortDescription: data.description,
                        type: "stream"
                    };
                    items.set(id, item);
                    return item;
                }).catch(function () {
                    return fetch("https://noembed.com/embed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id))
                        .then(function (response) { return response.ok ? response.json() : null; })
                        .then(function (data) {
                            if (data && data.title) {
                                var item = {
                                    url: "/watch?v=" + id,
                                    title: data.title,
                                    uploaderName: data.author_name,
                                    thumbnail: data.thumbnail_url,
                                    type: "stream"
                                };
                                items.set(id, item);
                                return item;
                            }
                            return null;
                        })
                        .catch(function () { return null; })
                        .then(function (item) {
                            return item || {
                                url: "/watch?v=" + id,
                                title: "Video " + id,
                                uploaderName: "",
                                thumbnail: "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg",
                                type: "stream"
                            };
                        });
                });
            }

            var PLAYERS = [
                { id: "nocookie", label: "YouTube", src: function (id) { return "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0&modestbranding=1"; } },
                { id: "plain", label: "YouTube direct", src: function (id) { return "https://www.youtube.com/embed/" + id + "?autoplay=1&rel=0"; } },
                { id: "invidious", label: "Invidious", src: function (id) { return "https://yewtu.be/embed/" + id + "?autoplay=1"; } }
            ];

            function renderWatch(id, token) {
                view.innerHTML = '<div class="watch">'
                    + '<div class="watch__main"><div id="stage">' + skeletonRow(0) + "</div></div>"
                    + '<aside class="watch__aside"><div id="side"></div></aside>'
                    + "</div>";

                loadVideo(id).then(function (item) {
                    if (token !== renderToken) { return; }

                    var channel = item.uploaderName || item.uploader || "";
                    var description = item.shortDescription || item.description || "";
                    var stats = [count(item.views) ? count(item.views) + " views" : "", when(item)]
                        .filter(Boolean).join("  ·  ");

                    if (channel) {
                        pushHistory({
                            id: id,
                            title: item.title || "",
                            channel: channel,
                            thumbnail: thumbFor(item, id)
                        });
                    }

                    document.title = (item.title || "Video") + " · OpenTube";

                    document.getElementById("stage").innerHTML =
                        '<div class="screen" id="screen"></div>'
                        + '<h1 class="watch__title">' + esc(item.title || "Untitled") + "</h1>"
                        + '<div class="watch__by">'
                        + (item.uploaderAvatar
                            ? '<img src="' + esc(item.uploaderAvatar) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
                            : "")
                        + '<div class="watch__who"><b>' + esc(channel || "Unknown channel") + "</b>"
                        + (stats ? "<span>" + esc(stats) + "</span>" : "")
                        + "</div></div>"
                        + '<div class="watch__tools">'
                        + '<a class="btn" href="https://www.youtube.com/watch?v=' + esc(id) + '" target="_blank" rel="noopener noreferrer">Open on YouTube</a>'
                        + '<button class="btn btn--plain" type="button" id="copy">Copy link</button>'
                        + "</div>"
                        + (description
                            ? '<p class="label">Description</p><p class="desc desc--clamped" id="desc">' + esc(description) + "</p>"
                                + '<p style="margin:8px 0 0"><button class="btn btn--plain" type="button" id="more">Show more</button></p>'
                            : "")
                        + '<p class="label">Player</p>'
                        + '<div class="watch__tools" id="players">'
                        + PLAYERS.map(function (player, index) {
                            return '<button class="btn" type="button" data-player="' + player.id + '"'
                                + (index === 0 ? ' aria-pressed="true"' : ' aria-pressed="false"') + ">"
                                + esc(player.label) + "</button>";
                        }).join("")
                        + "</div>";

                    mountPlayer(id, PLAYERS[0]);

                    var copy = document.getElementById("copy");
                    if (copy) {
                        copy.addEventListener("click", function () {
                            var link = location.origin + location.pathname + "#/watch/" + id;
                            var settle = function () { copy.textContent = "Copied"; };
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(link).then(settle, function () {});
                            } else {
                                settle();
                            }
                        });
                    }

                    var more = document.getElementById("more");
                    if (more) {
                        more.addEventListener("click", function () {
                            var desc = document.getElementById("desc");
                            desc.classList.toggle("desc--clamped");
                            more.textContent = desc.classList.contains("desc--clamped") ? "Show more" : "Show less";
                        });
                    }

                    var players = document.getElementById("players");
                    players.addEventListener("click", function (event) {
                        var button = event.target.closest("[data-player]");
                        if (!button) { return; }
                        players.querySelectorAll("[data-player]").forEach(function (node) {
                            node.setAttribute("aria-pressed", node === button ? "true" : "false");
                        });
                        var chosen = PLAYERS.filter(function (player) {
                            return player.id === button.getAttribute("data-player");
                        })[0];
                        if (chosen) { mountPlayer(id, chosen); }
                    });

                    loadRelated(id, item, token);
                }).catch(function (error) {
                    if (token !== renderToken) { return; }
                    view.innerHTML = failure(error);
                });
            }

            function mountPlayer(id, player) {
                var screen = document.getElementById("screen");
                if (!screen) { return; }
                screen.innerHTML = '<iframe src="' + esc(player.src(id)) + '"'
                    + ' title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"'
                    + " allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\"></iframe>";
            }

            function loadRelated(id, item, token) {
                var side = document.getElementById("side");
                var query = (item.title || "").slice(0, 70);

                side.innerHTML = '<div class="row__head"><h2>More like this</h2></div>' + skeletonRow(0);

                var request = query
                    ? api("/search?q=" + encodeURIComponent(query) + "&filter=videos")
                    : Promise.reject(new Error("no title"));

                request.then(function (data) {
                    var list = (data.items || []).filter(function (entry) {
                        return entry && entry.type === "stream" && videoId(entry.url) && videoId(entry.url) !== id;
                    }).slice(0, 14);
                    paintRelated(list);
                }).catch(function () {
                    if (!item.uploaderName) { paintRelated([]); return; }
                    api("/search?q=" + encodeURIComponent(item.uploaderName) + "&filter=videos").then(function (data) {
                        paintRelated((data.items || []).filter(function (entry) {
                            return entry && entry.type === "stream" && videoId(entry.url) && videoId(entry.url) !== id;
                        }).slice(0, 14));
                    }).catch(function () { paintRelated([]); });
                });

                function paintRelated(list) {
                    if (token !== renderToken || !side.isConnected) { return; }
                    var body = list.map(rowItem).join("");
                    side.innerHTML = '<div class="row__head"><h2>More like this</h2></div>'
                        + (body
                            ? '<ul class="list">' + body + "</ul>"
                            : '<p class="rowitem__meta">Nothing adjacent came back. Try a search above.</p>');
                }
            }

            /* ---------- wiring ---------- */

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                var query = input.value.trim();
                if (!query) { location.hash = "#/"; return; }
                location.hash = "#/search/" + encodeURIComponent(query);
            });

            window.addEventListener("hashchange", render);

            render();
        })();
    </script>
</body>
</html>
